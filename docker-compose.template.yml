# Template docker-compose para multi-cliente
# Reemplazar {{SLUG}} por el slug del cliente al crear instancia
#
# IMPORTANTE: usa la imagen base compartida asistentebot-base:latest.
# NO hace build por cliente (ahorra ~2GB de librerias y 15 min por cliente).
# Si la imagen no existe, construirla primero:
#   cd /mnt/data/rodrigo-bot-template
#   docker build -f Dockerfile.base -t asistentebot-base:latest .
#
# Los datos del cliente viven en ./data (bind mount), editables sin rebuild.

services:
  web:
    image: asistentebot-base:latest
    container_name: {{SLUG}}-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_DB_PATH=/app/data/app.sqlite3
    volumes:
      - ./data:/app/data
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - boston-ai_default

  worker:
    image: asistentebot-base:latest
    container_name: {{SLUG}}-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_DB_PATH=/app/data/app.sqlite3
    volumes:
      - ./data:/app/data
    command: python scripts/run_worker.py
    depends_on:
      web:
        condition: service_healthy
    deploy:
      replicas: 1
    networks:
      - boston-ai_default

networks:
  boston-ai_default:
    name: boston-ai_default
    driver: bridge
    external: true
