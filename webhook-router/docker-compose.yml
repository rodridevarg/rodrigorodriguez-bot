services:
  router:
    build: .
    container_name: webhook-router
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8100"
    env_file:
      - .env
    volumes:
      - router-data:/app/data
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8100
      --workers 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - boston-ai_default

volumes:
  router-data:
    driver: local

networks:
  boston-ai_default:
    name: boston-ai_default
    driver: bridge
    external: true
